<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ryzen 67s</title>
</head>

<body>

    <!-- 상단 헤더 -->
    <div id="topBar">
        <img id="title" src="./Ryzen 67s.jpg" alt="Ryzen 67s">
        <button id="loginBtn">로그인/회원가입</button>
    </div>

    <!-- 로그인 창 -->
    <dialog id="loginDialog">
        <button id="login나가기">나가기</button>

        <div id="loginDialog내용">
            <h2>로그인</h2>
            <input type="text" placeholder="id">
            <input type="password" placeholder="password">
            <button>제출</button>

            <p>
                아직 계정이 없나요?
                <span id="회원가입span">회원가입</span>
                으로 계정을 생성하세요!
            </p>
        </div>
    </dialog>

    <!-- 메인 메뉴 -->
    <nav id="mainNav">
        <a href="#">HOME</a>
        <a href="#">TEAM</a>
        <a href="#">ROSTER</a>
        <a href="#">SCHEDULE</a>
        <a href="#">NEWS</a>
    </nav>

        <!-- 메인 배너 -->
    <section id="hero">
        <div id="heroText">
            <p>RYZEN 67s OFFICIAL WEBSITE</p>
            <h1>RISE TOGETHER</h1>
        </div>

        <div id="heroStadium">
            <img src="./라이젠 필드.jpg" alt="Baseball stadium">
            <p>OUR HOME, OUR PRIDE</p>
            <h2>RYZEN FIELD</h2>
        </div>
    </section>

    <!-- 하단 영역 -->
        <!-- 하단 영역 -->
    <section id="bottomSection">
        <div id="community">
            <h2>COMMUNITY</h2>
            <div id="communityBox">
                <ul id="categoryList">
                    <li><button class="catBtn active" data-cat="전체">전체</button></li>
                    <li><button class="catBtn" data-cat="공지사항">공지사항</button></li>
                    <li><button class="catBtn" data-cat="자유게시판">자유게시판</button></li>
                    <li><button class="catBtn" data-cat="경기 후기">경기 후기</button></li>
                </ul>

                <div id="postArea">
                    <ul id="postList"></ul>

                    <form id="postForm">
                        <select id="postCategory">
                            <option>공지사항</option>
                            <option>자유게시판</option>
                            <option>경기 후기</option>
                        </select>
                        <input id="postTitle" type="text" placeholder="제목을 입력하세요" required>
                        <button type="submit">글쓰기</button>
                    </form>
                </div>
            </div>
        </div>

        <div id="shortcuts">
            <h2>바로가기</h2>
            <div id="shortcutList">
                <a class="shortcutBtn" href="#">다음 경기 일정</a>
                <a class="shortcutBtn" href="#">공식 인스타그램</a>
                <a class="shortcutBtn" href="#">Ynxcu's Music Studio</a>
                <a class="shortcutBtn" href="#">유니폼 둘러보기</a>
            </div>
        </div>
    </section>
    <script src="script.js"></script>

</body>
</html>
